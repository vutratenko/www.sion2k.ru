{{ define "head" }}
<meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
<link rel="stylesheet" href="{{ .Site.Params.staticPath }}/css/index.css" media="all">
<link rel="stylesheet" href="{{ .Site.Params.staticPath }}/css/home.css" media="all">
<script defer src="{{ .Site.Params.staticPath }}/fontawesome-6/all-6.4.2.js"></script>
{{ end }}

{{ define "title" }}
{{ .Title }} | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<section id="cv" class="py-5">
    <div class="container px-3 px-sm-5">
        <h1 class="home-section-title text-center mb-3">{{ .Title }}</h1>
        {{ with .Content }}
        <div class="home-prose text-center mb-4">
            {{ . }}
        </div>
        {{ end }}
        <p class="text-center mb-5">
            <a class="btn" href="{{ "resume.pdf" | relURL }}">Скачать PDF</a>
        </p>
    </div>
</section>
{{- partial "sections/experience.html" . -}}
{{- partial "sections/education.html" . -}}
{{ end }}
