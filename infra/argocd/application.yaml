apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sion2k-site
  namespace: shturval-cd
spec:
  project: default
  source:
    repoURL: https://github.com/vutratenko/www.sion2k.ru.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: sion2k-site
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
