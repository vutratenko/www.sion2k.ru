stages:
  - build
  - deploy

build_hugo:
  stage: build
  image: gohugoio/hugo
  script: hugo
  artifacts:
    paths:
      - public

build_docker:
  stage: build
  needs: ["build_hugo"]
  image: docker
  services:
    - docker:dind
  before_script:
    - docker login registry.gitlab.com -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
  script:
#    - docker pull registry.gitlab.com/sion2k/www.sion2k.ru:latest

    - docker build -t registry.gitlab.com/sion2k/www.sion2k.ru:${CI_COMMIT_SHORT_SHA} -t registry.gitlab.com/sion2k/www.sion2k.ru:latest --cache-from registry.gitlab.com/sion2k/www.sion2k.ru:latest .
    - docker push registry.gitlab.com/sion2k/www.sion2k.ru:${CI_COMMIT_SHORT_SHA}
    - docker push registry.gitlab.com/sion2k/www.sion2k.ru:latest

deploy:
  stage: deploy
  environment:
    name: production
    url: https://www.sion2k.ru/
  image:
    name: bitnami/kubectl:latest
    entrypoint: ['']
  script:
    - kubectl config get-contexts
    - kubectl config use-context sion2k/www.sion2k.ru:cornertop-k3s 
    - kubectl -n notion-bot apply -f deploy.yaml
    - kubectl -n notion-bot set image deployment www.sion2k.ru www.sion2k.ru=registry.gitlab.com/sion2k/www.sion2k.ru:${CI_COMMIT_SHORT_SHA}
