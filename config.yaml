          Wiley - очень большое и очень старое (более 210 лет) американское научное издательство. Работал в бизнес-домене Knowledge & Learning, которое развивало собственные EdTech решения, используемые в 75% американских вузов.

          Как DevOps инженер:
          - Развивал облачную автоматизацию и эксплуатацию для нескольких ключевых проектов компании во время цифровой трансформации.
          - Руководил повседневными операциями российских и индийских членов команды.
          - Работал с несколькими продуктовыми scrum-командами.
          - Работал над внедрением CI/CD и других практик DevOps в продуктовых командах.
          - Участвовал в разработке сервисов.
          - Ежедневно общался с англоговорящими коллегами по всему миру.

          За время работы:
          
          ✔ Осуществил построение инфраструктуры для нового поколения LMS на базе Amazon Web Services с использованием подхода Infracstructure as Code.
          
          ✔ Реализовал улучшенную проверку работоспособности сервисов с помощью собственного watchdog сервиса.
          
          ✔ Уменьшил время развертывания сервисов с 2,5 часов до 15-20 минут.
          
          ✔ Выстроил Канбан процесс в команде DevOps.

      - job: "Senior Unix and Storage Engineer"
        company: "DBI"
        companyUrl: "https://dbi.ru"
        date: Октябрь 2012 - Ноябрь 2016
        info:
          enable: false
        content: |
          DBI - компания-интегратор, занимающаяся обслуживанием систем на базе Oracle в России и США.

          ✔ Успешно совместил обязанности Unix и Storage администратора
          
          ✔ Создал различные сценарии автоматизации, которые упростили ежедневные операции как для Storage, так и для Unix команд.
          
          ✔ Помог участникам команды Unix в изучении повседневных операций Storage команды.
          
          ✔ Внедрил подходы Unix команды (такие как shell скрипты и рабочие процессы круглосуточной поддержки) для ежедневных операций Storage команды, таких как устранение неполадок, связанных с хранением.
          
          ✔ Успешно управлял огромными корпоративными системами хранения (HP 3Par, NetApp 7-mode и cluster-mode), а также более чем 200 серверами в качестве конечных точек хранения.
          
          ✔ Участвовал в процессах Agile Engineering Team (System Engineering, System Operations, Storage Operations) (удаленно с коллегами из США).
          
          ✔ Успешно сдал экзамен «NetApp Ceritfied Associate».
          
          ✔ Взаимодействовал с англоязычными клиентами и коллегами.

