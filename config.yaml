      - job: "Технический директор, Умный Дом"
        company: "РТК ИТ"
        companyUrl: "https://rtkit.ru"
        date: "Март 2023 - Сентябрь 2023"
        info:
          enable: false
        featuredLink:
          enable: true
          name: "Посмотреть на Умный дом"
          url: "https://lk.smarthome.rt.ru/"
        content: |
          Продукт "Видеонаблюдение и Умный Дом Ростелеком" - самое большое в России видеонаблюдение в сегменте B2C. 500 000 активных камер наблюдения, около 200 000 MAU.

          Я в продукте:
          - Отвечал за разработку и поставку.
          - Развивал техническую команду продукта (50 человек).
          - Оптимизирул ИТ-процессы.
          - Управлял ИТ-бюджетом (CAPEX/OPEX).

          За полгода:

          ✔ Произвёл анализ состояния команды, процессов и текущих проблем.
          
          ✔ Сформировал инженерную стратегию подразделения и начал её внедрение.
          
          ✔ Стабилизировал найм и доукомлектовал штат недостающими специалистами.
          
          ✔ Оценил и зафиксировал бюджетные потребности подразделения на остаток 2023 года.

      - job: "Технический директор, Property Technology"
        company: "R1"
        companyUrl: "https://r1.team"
        date: "Август 2021 - Март 2023"
        featuredLink:
          enable: true
          name: "Много домофонов, хороших и разных"
          url: "https://dom.ru/domofon"
        info:
          enable: false
        content: |
          Работал в компании R1, собственном B2C ИТ-интеграторе ЭР-Телекома в составе бизнес-домена Property Tech (Цифровые технологии в области недвижимости, интернет вещей). Участвовал в развитии продуктов "Умный Дом.ру" (B2C сервис, самая большая цифровая домофония в России и небольшое B2C видеонаблюдение, более 60 000 умных домофонов, около 15 000 камер наблюдения, 1 500 000 MAU) и "Личный Кабинет Управляющей компании" (B2B сервис, самый распространённый в сегменте интерфейс управляющих компаний для работы с умным зданием и взаимодействия с жителями, 900 управляющих компаний, 5400 домов, 1 350 000 квартир).

          Отвечал за всю инженерную часть бизнес-домена:
          - Управлял процессами разработки, поставки, эксплуатации и поддержки
          - Управлял бюджетом (CAPEX/OPEX) домена в части ИТ.
          - Формировал и успешно реализовывал техническую стратегию подразделения, согласованную с технической стратегией компании и бизнес-стратегией домена.
          - Постоянно взаимодействовал с бизнес-заказчиком, партнёрами.
          - Вёл переговоры с поставщиками оборудования и ПО.

          За время работы:
          
          ✔ Команда и системы выведены из состояния непрекращающейся аварии.
          
          ✔ Команда доукомплектована специалистами (с 30 до 50 человек).
          
          ✔ Команда перезапущена с обновлёнными процессами разработки и поставки.
          
          ✔ Внедрены обновлённые процессы эксплуатации, включая отслеживание SLI/SLO, а так же сбор постмортемов с реализацией необходимых действий по итогам инцидента.
          
          ✔ Производительность поставки выросла с уровня Low до High по оценке DORA.
          
          ✔ Перенесен нагруженный (1000 rps) бэкенд (~30 сервисов) из on-premise среды в Yandex Cloud с обновлением стека технологий, что привело к снижению стоимости владения инфраструктурой на 71%.
          
          ✔ Перезапущено мобильное приложение (1,5kk MAU) в новом архитектурном дизайне, дизайне интерфейсов, стеке и логике, дав возможность развивать и улучшать опыт пользователя.
          
          ✔ Бэкенд адаптирован под Cloud Native стандарты, что дало большую эластичность и надёжность систем.
          
          ✔ Начата декомпозиция монолитной части бэкенда и вынос части нагруженных компонент в более управляемые сервисы, снизив аварийность на 25% и подняв SLI доступности услуг с 86% до 98%.
      
      - job: "Engineering Manager"
        company: "Sravni"
        companyUrl: "https://sravni.ru"
        date: "Октябрь 2020 - Август 2021"
        featuredLink:
          enable: true
          name: "Выбери лучшее"
          url: "https://sravni.ru"
        info:
          enable: false
        content: |
          Сравни.ру - компания, помогающая пользователям выбирать более выгодные для себя финансовые продукты. Бизнес на стыке MarTech и FinTech.

          Выступал в качестве заместителя CTO и технического Владельца Продукта:
          - Отвечал за инфраструктуру, технологическую платформу, поставку и развитие инженерной культуры.
          - Вёл ряд ключевых IT проектов.
          - Помогал компании преодолеть вызовы оставшиеся от состояния стартапа и строить быструю и надёжную продуктовую разработку.

          За время работы:
          
          ✔ Построено крепкое Agile-сообщество.
          
          ✔ Запущена команда технологической платформы, которая развивала общие сервисы компании, включая инфраструктуру, а так же развивала стандарты разработки и эксплуатации.
          
          ✔ Реализована защищённая по ГОСТ Р 57580.1-2017 инфраструктура в Yandex Cloud, которая прошла внешний аудит и получила уровень УЗ-2 безопасности данных, разблокировав возможность получения лицензии финансовой платформы от ЦБ РФ.
          
          ✔ Тестовый контур мигрирован из Hetzner в Yandex Cloud, а также приведен его в соответствие с продуктивной средой, что позволило увеличить качество функционального тестирования и разблокировать применение нагрузочных тестов.
          
          ✔ Реализован общий платёжный шлюз, позволяющий командам интегрировать оплату на сайте независимо от эквайринга.

      - job: "Head of Infrastructure Platform"
        company: "X5 Group"
        companyUrl: "https://x5.ru"
        date: Июль 2019 - Октябрь 2020
        info:
          enable: false
        content: |
          X5 Retail Group - один из самых больших продуктовых ритейлеров страны. Работал параллельно в нескольких направлениях Корпоративного Центра в части DevOps/SRE.

          Вёл параллельно несколько команд системных инженеров: команду инфраструктурной платформы, команду CI инженеров магазинных систем, горизонталь SRE продуктовых команд. Непрерывно работал с участниками процесса производства ПО над улучшением культуры разработки и внедрением практик DevOps и SRE.

          За время работы:
          
          ✔ Вывел команду выгоревших инженеров инфраструктурной платформы на производительный уровень.
          
          ✔ Оптимизировал рабочие процессы в командах инфраструктурной платформы и магазинных систем.
          
          ✔ Укомплектовал горизонталь SRE магазинных систем.
          
          ✔ Создал внутреннее DevOps сообщество Х5 (порядка 75 участников на момент ухода из компании).

          Команда магазинных систем осуществила:
          
          ✔ Произвела трансформацию старой исторически сложившейся сборочной инфраструктуры в современную гибкую и расширяемую платформу.
          
          ✔ Значительное уменьшение техдолга конвейера поставки магазинных систем, увеличив SLI сборки до 96%
          
          ✔ Уменьшение времени сборки дистрибутивов на 50%
          
          ✔ Старт внутреннего проекта по переносу всей автоматизации с зоопарка скриптов на единый CLI на Python, улучшив качество кода и тестируемость сборочной автоматизации. Сейчас проект развивается и сборочная автоматизация производится в рамках него.

          Команда инфраструктурной платформы осуществила:
          
          ✔ Переход на процесс непрерывной поставки инженеров
          
          ✔ Улучшение процесса поддержки внутренних пользователей и уменьшение времени закрытия заявок за счёт широкого покрытия задач автоматизацией
          
          ✔ Запуск сервиса API Gateway на основе Gravitee, реализовав возможность ситемам X5 предоставлять внешний API.

      - job: "Senior DevOps Engineer"
        company: "Wiley"
        companyUrl: "https://wiley.com"
        date: Ноябрь 2016 - Июль 2019
        info:
          enable: false
        content: |
          Wiley - очень большое и очень старое (более 210 лет) американское научное издательство. Работал в бизнес-домене Knowledge & Learning, которое развивало собственные EdTech решения, используемые в 75% американских вузов.

          Как DevOps инженер:
          - Развивал облачную автоматизацию и эксплуатацию для нескольких ключевых проектов компании во время цифровой трансформации.
          - Руководил повседневными операциями российских и индийских членов команды.
          - Работал с несколькими продуктовыми scrum-командами.
          - Работал над внедрением CI/CD и других практик DevOps в продуктовых командах.
          - Участвовал в разработке сервисов.
          - Ежедневно общался с англоговорящими коллегами по всему миру.

          За время работы:
          
          ✔ Осуществил построение инфраструктуры для нового поколения LMS на базе Amazon Web Services с использованием подхода Infracstructure as Code.
          
          ✔ Реализовал улучшенную проверку работоспособности сервисов с помощью собственного watchdog сервиса.
          
          ✔ Уменьшил время развертывания сервисов с 2,5 часов до 15-20 минут.
          
          ✔ Выстроил Канбан процесс в команде DevOps.

      - job: "Senior Unix and Storage Engineer"
        company: "DBI"
        companyUrl: "https://dbi.ru"
