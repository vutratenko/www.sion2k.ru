  home:
    seoTitle: "Владимир Утратенко — DevOps, архитектура, IT-карьера и технические проекты"
    credibility: "CPO · CTO · Platform Engineering · DevOps · B2B IT · Спикер"
    about:
      title: "Обо мне"
      path: "System Engineer → DevOps / Platform Engineering → CTO → CPO"
      companies: "Числитель · Uzum · РТК ИТ · R1 · Sravni · X5 Group · Wiley · DBI"
      content: |
        Начинал системным инженером, затем занимался DevOps, Platform Engineering и инфраструктурой, управлял техническими командами и работал CTO. Сейчас отвечаю за продукт Штурвал.

        За это время успел посмотреть на IT с инженерной, управленческой и продуктовой стороны.
    product:
      title: "Отдельно люблю сложные B2B IT-продукты"
      content: |
        Сейчас я CPO Штурвала — коммерческой Kubernetes-платформы для компаний уровня Enterprise.

        Этот опыт полезен, когда нужно разобраться с discovery и roadmap, стратегией технического продукта, enterprise-presale, требованиями крупных заказчиков, позиционированием и тем, как product и engineering договариваются между собой. Особенно — когда технические возможности надо перевести в понятную пользователю и бизнесу ценность.

        Сюда можно прийти с вопросом, если он уже лежит рядом с текущей работой. Отдельный формат «продуктовый консалтинг» я из этого не собираю.
    publications:
      title: "Иногда рассказываю о том, что успел проверить на практике"
    speaking:
      teaserTitle: "Публичный эксперт: конференции, вебинары, подкасты, панели"
      teaserLead: |
        Рассказываю о том, что проверил на практике — от DevOps и платформ до карьеры и инженерного лидерства. Если вы организатор мероприятия, можно обсудить тему и формат.
      teaserButton: "Все выступления и публикации →"
      formatPills:
        - Конференции
        - Вебинары
        - Подкасты
        - Панели

  speaking:
    seoTitle: "Выступления | Владимир Утратенко — спикер о DevOps, платформах и IT-карьере"
    description: "Публичные выступления Владимира Утратенко: конференции DevOpsConf и UIC.Dev, вебинары, статьи и экспертные панели."
    intro: |
      Я не академический спикер — рассказываю из практики CPO и CTO: как устроены платформы, процессы разработки, карьера в IT и сложные B2B IT-продукты.

      Мне интересны живые форматы: доклад на конференции, гостевой эфир в подкасте, вебинар или панельная дискуссия с другими экспертами.
    topicsTitle: "О чём могу рассказать"
    topics:
      - DevOps, Platform Engineering и инфраструктурные платформы
      - CI/CD, процессы разработки и инженерная культура
      - Карьера в IT и переход в управление
      - Инженерное и техническое лидерство
      - B2B IT-продукты и enterprise-контекст
    formatsTitle: "Форматы"
    formats:
      - title: Конференция
        description: Доклад или workshop для профессиональной аудитории — DevOps, инфраструктура, карьера, лидерство.
      - title: Вебинар
        description: Онлайн-формат для компании, сообщества или медиапроекта — с фокусом на практику и Q&A.
      - title: Подкаст
        description: Гостевой выпуск — разбор кейсов, трендов и спорных тем без «продающей» подачи.
      - title: Панель
        description: Дискуссия с другими экспертами — модерация или участие в panel discussion.
    portfolioTitle: "Выступления и публикации"
    inviteCTA:
      title: "Пригласить на мероприятие"
      content: "Напишите, что за формат, аудитория и тема — отвечу, если смогу быть полезен."
      meetUrl: "https://meet.sion2k.ru/sion2k"
      meetLabel: "Запланировать разговор"
      contactUrl: "/#contact"
      contactLabel: "Написать"
