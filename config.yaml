        content: |
          Продуктовый стрим Uzum Market - это самый большой и популярный маркетплейс Узбекистана.

          Отвечаю за:
          - Бесперебойную работу инфраструктуры и сервисов
          - Безопасность сервисов
          - IT-процессы эксплуатации
